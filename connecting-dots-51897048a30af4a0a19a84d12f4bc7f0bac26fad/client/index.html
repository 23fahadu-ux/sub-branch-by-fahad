<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional Podcast Studio Platform by SCCG" />
    <title>Connecting Dot | Powered by SCCG</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230057A8'/><circle cx='50' cy='50' r='12' fill='white'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
        --accent-glow: 0 0 20px rgba(0, 168, 255, 0.3);
      }
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        font-family: 'Inter', sans-serif; 
        -webkit-font-smoothing: antialiased; 
        background: #050a15;
        color: #fff;
        overflow-x: hidden;
      }
      
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

      /* Responsive helpers */
      @media (max-width: 768px) {
        body { font-size: 14px; }
      }

      /* Smooth scrollbar for backstage strip */
      .backstage-strip::-webkit-scrollbar { height: 4px; }
      .backstage-strip::-webkit-scrollbar-thumb { background: rgba(0,168,255,0.3); border-radius: 4px; }

      /* Speaking pulse animation */
      @keyframes speakingPulse {
        0%, 100% { box-shadow: inset 0 0 20px rgba(0, 168, 255, 0.2); }
        50% { box-shadow: inset 0 0 40px rgba(0, 168, 255, 0.5); }
      }

      /* Reaction float animation */
      @keyframes reactionFloat {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        50% { transform: translateY(-120px) scale(1.3); opacity: 0.8; }
        100% { transform: translateY(-280px) scale(0.6); opacity: 0; }
      }

      /* Selection styling */
      ::selection { background: rgba(0,168,255,0.3); color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
